experiment:
  name: van_liab3p_v3
  description: VAN liability model - baseline - v3 full feature list
  target: pp_bi_pp_pd            # built in stage 01/08 from combine.target (see below)
  exposure: ee_bi_imps_ee_pd_imps  # built in stage 01/08 from combine.exposure
  combine:                       # optional: exposure = max(ee), target = sum(pp*ee) / exposure
    target: [pp_bi, pp_pd]
    exposure: [ee_bi_imps, ee_pd_imps]
  # assumes GLM pred_pp_liab_3p is BI+PD loss per max(ee_bi, ee_pd)
  coverage: liab
  vehicle_type: VAN
  loss_cap: 125000               # applied to combined BI+PD loss
  loss_type: bi+pd               # label only - not read by any code
  exposure_floor: 0.0833
  exposure_columns:
  - ee_bi_imps
  - ee_pd_imps
run_mode: prod
debug1:
  train_folds:
  - 1
  test_folds:
  - 6
  holdout_folds: []
  hpo_trials: 10
debug2:
  train_folds:
  - 1
  - 2
  test_folds:
  - 6
  - 7
  holdout_folds:
  - 8
  hpo_trials: 20
prod:
  train_folds:
  - 1
  - 2
  - 3
  - 4
  - 5
  test_folds:
  - 6
  - 7
  holdout_folds:
  - 8
  - 9
  - 10
  hpo_trials: 20
machines:
  PC1:
    conda_env: py311_26v1
    paths:
      master_data_path: null
      aux_data_path: null
      output_path: null
  PC2:
    conda_env: carfax26v1
    paths:
      master_data_path: /home/carfax_shared/D model data steps/Master Datasets/van
      aux_data_path: /home/carfax_shared/D model data steps/Master Datasets/van
      output_path: /home/carfax_shared/dmodel_carfax/exploration/Dmodel_output_data/van_liab/v3
  PC3:
    conda_env: py311_26v1
    paths:
      master_data_path: /Users/Mach/dev/aps/data/2026_Dmodel_data/alldata/van
      aux_data_path: /Users/Mach/dev/aps/data/2026_Dmodel_data/alldata/van
      output_path: output/van_liab/v3
  PC4:
    conda_env: py311_26v1
    paths:
      master_data_path: null
      aux_data_path: null
      output_path: null
data:
  master_file: master_dataset_van.parquet
  aux_file: van_with_dep_factor_fold.parquet
  join_key: vin_date
  fold_column: fold
  join_type: inner
  columns_to_load_file: columns_to_load_during_dataassembly.csv
  control_model_file: aux_dataset_van_vindate_ctl.parquet
features:
  inclusion_file: null  # not used by pipeline
  exclusion_file: exclusion.csv
  blank_file: null
  monotonicity_file: monotonicity.csv
feature_engineering:
  pca:
    enabled: true
    features_file: pca_features.csv
    group_column: pca_group
    max_components: 5
    variance_threshold: 0.95
    prefix_template: pca_{group}_
model:
  target_method: residual
  use_glm_init: true
  glm_init_transform: log
  glm_prediction_column: pred_pp_liab_3p
xgboost:
  objective: reg:tweedie
  tweedie_variance_power: 1.5
  eval_metric: tweedie-nloglik
  learning_rate: 0.05
  max_depth: 4
  min_child_weight: 1000
  subsample: 1.0
  colsample_bytree: 1.0
  alpha: 10
  n_estimators: 3000
  early_stopping_rounds: 150
  tree_method: hist
  device: cpu
  random_state: 42
  verbosity: 1
execution:
  stages:
    stage_01: true
    stage_02: true
    stage_03: true
    stage_04a: true
    stage_04b: true
    stage_04c: true
    stage_05a: true
    stage_05b: false
    stage_05c: true
    stage_06: true
    stage_07: true
    stage_08: true
    stage_08b: true
    stage_09: false
  stop_on_error: true
  cleanup_memory: true
hyperparameter_optimization:
  method: optuna
  n_trials: 100
  timeout_minutes: 60
  param_grid:
    max_depth:
    - 2
    - 3
    - 4
    learning_rate:
    - 0.02
    - 0.05
    min_child_weight:
    - 2000
    - 5000
    - 10000
    - 20000
    subsample:
    - 0.7
    - 0.8
    colsample_bytree:
    - 0.7
    - 1.0
    tweedie_variance_power:
    - 1.2
    - 1.3
    - 1.4
    reg_lambda:
    - 1
    - 10
    - 50
  scoring:
    bins: 10
    fit_threshold: 0.7
    steepness: 20.0
    power_weight: 0.2
    power_norm_cap: 0.5
scoring:
  holdout:
    source: master
    folds:
    - 8
    - 9
    - 10
    has_target: true
analysis:
  slice_by:
  - state
  datasets:
  - name: train
    file: results/05c_predictions_train.parquet
  - name: test
    file: results/05c_predictions_test.parquet
  - name: holdout
    file: scoring/holdout/predictions.parquet
shap_analysis:
  top_n_features: 40
  datasets:
  - train
  - test
  residual_plot:
    round_value: 2
    print_table: true
  shap_range_plot:
    shap_round_level: 3
    feature_round_to: 0.001
    min_ntile: 5
    max_ntile: 95
    filter_used_only: false
